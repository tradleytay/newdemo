<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Order Tracking — MCM Photography</title>
    <meta name="description" content="Track your school photography order status through the MCM Photography parent portal.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white navbar-light fixed-top shadow py-lg-0 px-4 px-lg-5 wow fadeIn" data-wow-delay="0.2s">
        <a href="index.html" class="navbar-brand d-block d-lg-none">
            <img src="img/logo.png" alt="MCM Photography Logo" style="max-height: 60px;" class="me-2">
            <span class="navbar-brand-text">MCM PHOTOGRAPHY</span>
        </a>
        <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-between py-4 py-lg-0" id="navbarCollapse">
            <div class="navbar-nav ms-auto py-0">
                <a href="index.html" class="nav-item nav-link">Home</a>
                <a href="school-photography.html" class="nav-item nav-link active">School Photography</a>
            </div>
            <a href="index.html" class="navbar-brand bg-primary py-2 px-4 mx-3 d-none d-lg-block d-flex align-items-center">
                <span class="h1 text-white mb-0">MCM PHOTOGRAPHY</span>
            </a>
            <div class="navbar-nav me-auto py-0">
                <a href="portfolio.html" class="nav-item nav-link">Gallery</a>
                <a href="contact.html" class="nav-item nav-link">Get In Touch</a>
            </div>
        </div>
    </nav>

    <section class="container-xxl py-5 school-page-hero">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8 wow fadeInUp" data-wow-delay="0.1s">
                    <div class="teacher-card">
                        <p class="text-primary text-uppercase mb-2">Order tracking</p>
                        <h1 class="display-6 mb-3">Track your package</h1>
                        <form id="orderTrackingForm" class="school-form">
                            <div class="row g-3 align-items-end">
                                <div class="col-md-9">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="orderReference" name="orderReference" placeholder="Order reference" required>
                                        <label for="orderReference">Order reference</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <button type="submit" class="btn btn-primary w-100 py-3">Track order</button>
                                </div>
                            </div>
                        </form>
                        <div class="mt-4" data-order-status></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="container-fluid bg-dark text-white border-top border-secondary px-0">
        <div class="d-flex flex-column flex-md-row justify-content-between">
            <div class="py-4 px-5 text-center text-md-start">
                <p class="mb-0">&copy; <a class="text-primary" href="index.html">MCM Photography</a> · All rights reserved.</p>
            </div>
            <div class="py-4 px-5 text-center text-md-end">
                <p class="mb-0">Cape Town • School photography • Order tracking</p>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/school-platform.js"></script>
</body>
</html>
